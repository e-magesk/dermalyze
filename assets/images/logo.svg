<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo com a cor primária e bordas arredondadas -->
  <rect width="200" height="200" rx="48" fill="#2563EB"/>

  <!-- Superfície da Pele (Camadas da Epiderme) -->
  <path d="M 30 155 Q 100 135 170 155" stroke="white" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 30 170 Q 100 155 170 170" stroke="white" stroke-opacity="0.15" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Bounding Box (Visão Computacional / IA) -->
  <path d="M 55 70 V 55 H 70" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 145 70 V 55 H 130" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 55 130 V 145 H 70" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 145 130 V 145 H 130" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Lesão de Pele (Única, muito irregular, cor sólida com a mesma opacidade dos traços inferiores) -->
  <path d="M 102 65 
           C 115 62 122 75 125 85 
           C 128 95 135 105 120 115 
           C 105 125 95 118 85 115 
           C 75 112 68 100 72 88 
           C 76 76 89 68 102 65 Z" 
        fill="white" 
        fill-opacity="0.3"/>
</svg>
